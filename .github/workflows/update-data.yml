name: Atualizar dados do OTIF

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar Excel do OneDrive
        env:
          SOURCE_URL: ${{ secrets.ONLINE_EXCEL_URL }}
        run: |
          set -e

          if [ -z "$SOURCE_URL" ]; then
            echo "ERRO: Secret ONLINE_EXCEL_URL não configurado."
            exit 1
          fi

          echo "Obtendo arquivo do OneDrive..."

          curl -L \
            --fail \
            --retry 3 \
            --retry-delay 2 \
            -H "User-Agent: Mozilla/5.0" \
            "$SOURCE_URL" \
            -o "Monitoramento Anual - 2026.xlsx"

          echo "Arquivo recebido:"
          file "Monitoramento Anual - 2026.xlsx"
          ls -lh "Monitoramento Anual - 2026.xlsx"

          # Verifica se realmente é um XLSX válido
          python - <<'PY'
          import zipfile

          arquivo = "Monitoramento Anual - 2026.xlsx"

          if not zipfile.is_zipfile(arquivo):
              print("ERRO: o OneDrive não entregou um arquivo XLSX válido.")
              print("O conteúdo recebido provavelmente é uma página de compartilhamento.")
              raise SystemExit(1)

          print("OK: arquivo XLSX válido.")
          PY

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install openpyxl

      - name: Gerar data.json
        run: python scripts/build_data.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base."
          else
            git commit -m "Atualizar dados do OTIF"
            git push
          fi
