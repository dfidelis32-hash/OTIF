name: Atualizar dados do OTIF

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar Excel do OneDrive
        run: |
          SHARE_ID="u!aHR0cHM6Ly8xZHJ2Lm1zL3gvYy82NGY4Nzg5MTBlOTRiM2IyL0lRQ243ODMyb3l6WFE1WU81WmtTMXpZSUFhSXF2YVhhVTI4QWhfRGsxWlRRZFNJP2U9eVJwTTJI"

          curl -fL \
            "https://api.onedrive.com/v1.0/shares/${SHARE_ID}/root/content" \
            -o "Monitoramento Anual - 2026.xlsx"

          file "Monitoramento Anual - 2026.xlsx"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install openpyxl

      - name: Gerar data.json
        run: python scripts/build_data.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base."
          else
            git commit -m "Atualizar dados do OTIF"
            git push
          fi
