name: Atualizar dados do OTIF

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar Excel do OneDrive
        run: |
          curl -L \
            "https://1drv.ms/x/c/64f878910e94b3b2/IQCn7832oyzXQ5YO5ZkS1zYIAaIqvaXaU28Ah_Dk1ZTQdSI?e=sO7UCM&download=1" \
            -o "Monitoramento Anual - 2026.xlsx"

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install openpyxl

      - name: Gerar data.json
        run: python scripts/build_data.py

      - name: Publicar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteração na base."
          else
            git commit -m "Atualizar dados do OTIF"
            git push
          fi
